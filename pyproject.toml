[project]
name = "incidentlens"
version = "0.1.0"
description = "An evidence-driven AI incident investigation lab"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["incidentlens*"]

[tool.setuptools.package-data]
incidentlens = ["web/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
